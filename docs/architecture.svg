<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820" role="img" aria-labelledby="title desc">
  <title id="title">Flareless Architecture Flow</title>
  <desc id="desc">Client requests enter the Flareless runtime, pass through route policy and scoped health ranking, then route to independent CDNs. Peer fallback and origin fallback are only used when policy allows them.</desc>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#222"/>
    </marker>

    <style>
      .title {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 32px;
        font-weight: 700;
        fill: #111;
      }

      .subtitle {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 17px;
        fill: #444;
      }

      .box {
        fill: #ffffff;
        stroke: #222;
        stroke-width: 2;
        rx: 16;
      }

      .policy {
        fill: #eef5ff;
      }

      .health {
        fill: #f2fff2;
      }

      .bucket {
        fill: #ffffff;
        stroke: #338a3e;
        stroke-width: 1.5;
        rx: 10;
      }

      .cdn {
        fill: #fff8e8;
      }

      .peer {
        fill: #f8eeff;
      }

      .origin {
        fill: #eeeeee;
      }

      .label {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 20px;
        font-weight: 700;
        fill: #111;
      }

      .bucket-label {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 14px;
        font-weight: 700;
        fill: #111;
      }

      .small {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 14px;
        fill: #333;
      }

      .tiny {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 12px;
        fill: #333;
      }

      .note {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        fill: #333;
      }

      .line {
        stroke: #222;
        stroke-width: 2.5;
        fill: none;
        marker-end: url(#arrow);
      }

      .dash {
        stroke: #666;
        stroke-width: 2;
        stroke-dasharray: 8 6;
        fill: none;
        marker-end: url(#arrow);
      }

      .boundary {
        fill: none;
        stroke: #999;
        stroke-width: 2;
        stroke-dasharray: 10 7;
        rx: 22;
      }
    </style>
  </defs>

  <rect x="20" y="20" width="1060" height="780" fill="#fafafa" stroke="#ddd"/>

  <text x="550" y="70" text-anchor="middle" class="title">Flareless Architecture Flow</text>
  <text x="550" y="102" text-anchor="middle" class="subtitle">Independent CDN routes first. Optional peer assisted recovery only after normal routes fail.</text>

  <rect x="390" y="135" width="320" height="70" class="box"/>
  <text x="550" y="165" text-anchor="middle" class="label">Client Request</text>
  <text x="550" y="188" text-anchor="middle" class="small">Browser, app, or video player</text>

  <path d="M550 205 L550 245" class="line"/>

  <rect x="350" y="245" width="400" height="80" class="box"/>
  <text x="550" y="278" text-anchor="middle" class="label">Flareless Runtime</text>
  <text x="550" y="302" text-anchor="middle" class="small">Receives request and prepares routing decision</text>

  <path d="M550 325 L550 365" class="line"/>

  <rect x="315" y="365" width="470" height="80" class="box policy"/>
  <text x="550" y="398" text-anchor="middle" class="label">Route Policy</text>
  <text x="550" y="422" text-anchor="middle" class="small">Defines provider list, timeout rules, peer fallback, and origin fallback</text>

  <path d="M550 445 L550 485" class="line"/>

  <rect x="260" y="485" width="580" height="112" class="box health"/>
  <text x="550" y="512" text-anchor="middle" class="label">Scoped Health Ranking</text>
  <text x="550" y="533" text-anchor="middle" class="small">Health is layered so one bad path does not poison every route</text>

  <rect x="290" y="548" width="120" height="34" class="bucket"/>
  <text x="350" y="568" text-anchor="middle" class="bucket-label">Global</text>
  <text x="350" y="580" text-anchor="middle" class="tiny">low weight</text>

  <rect x="430" y="548" width="120" height="34" class="bucket"/>
  <text x="490" y="568" text-anchor="middle" class="bucket-label">Route</text>
  <text x="490" y="580" text-anchor="middle" class="tiny">path group</text>

  <rect x="570" y="548" width="120" height="34" class="bucket"/>
  <text x="630" y="568" text-anchor="middle" class="bucket-label">Chunk</text>
  <text x="630" y="580" text-anchor="middle" class="tiny">exact object</text>

  <rect x="710" y="548" width="100" height="34" class="bucket"/>
  <text x="760" y="568" text-anchor="middle" class="bucket-label">Session</text>
  <text x="760" y="580" text-anchor="middle" class="tiny">optional</text>

  <path d="M550 597 L550 630" class="line"/>

  <rect x="85" y="635" width="250" height="75" class="box cdn"/>
  <text x="210" y="666" text-anchor="middle" class="label">CDN A</text>
  <text x="210" y="690" text-anchor="middle" class="small">Independent provider route</text>

  <rect x="425" y="635" width="250" height="75" class="box cdn"/>
  <text x="550" y="666" text-anchor="middle" class="label">CDN B</text>
  <text x="550" y="690" text-anchor="middle" class="small">Independent provider route</text>

  <rect x="765" y="635" width="250" height="75" class="box cdn"/>
  <text x="890" y="666" text-anchor="middle" class="label">CDN C</text>
  <text x="890" y="690" text-anchor="middle" class="small">Independent provider route</text>

  <path d="M550 630 C430 610 300 610 210 635" class="line"/>
  <path d="M550 630 L550 635" class="line"/>
  <path d="M550 630 C670 610 800 610 890 635" class="line"/>

  <rect x="70" y="730" width="960" height="45" class="boundary"/>
  <text x="550" y="758" text-anchor="middle" class="note">If a CDN times out or returns a blocked status, Flareless tries the next independent CDN route.</text>

  <path d="M840 540 C965 540 1005 610 1005 675" class="dash"/>
  <rect x="765" y="365" width="270" height="90" class="box peer"/>
  <text x="900" y="398" text-anchor="middle" class="label">Peer Assisted Fallback</text>
  <text x="900" y="422" text-anchor="middle" class="small">Only if policy allows</text>
  <text x="900" y="442" text-anchor="middle" class="small">Must verify hash before use</text>

  <path d="M785 405 L730 405" class="dash"/>
  <text x="758" y="390" text-anchor="middle" class="small">all CDNs fail</text>

  <rect x="65" y="365" width="250" height="90" class="box origin"/>
  <text x="190" y="398" text-anchor="middle" class="label">Origin Fallback</text>
  <text x="190" y="422" text-anchor="middle" class="small">Only if policy allows</text>
  <text x="190" y="442" text-anchor="middle" class="small">Never expose private credentials</text>

  <path d="M315 405 L370 405" class="dash"/>
  <text x="342" y="390" text-anchor="middle" class="small">last resort</text>

  <rect x="55" y="135" width="270" height="130" class="box"/>
  <text x="190" y="168" text-anchor="middle" class="label">Trust Model</text>
  <text x="190" y="195" text-anchor="middle" class="small">Providers are fallible</text>
  <text x="190" y="218" text-anchor="middle" class="small">Peers are untrusted</text>
  <text x="190" y="241" text-anchor="middle" class="small">Content must be verified</text>

  <rect x="775" y="135" width="270" height="130" class="box"/>
  <text x="910" y="168" text-anchor="middle" class="label">Security Controls</text>
  <text x="910" y="195" text-anchor="middle" class="small">Signed manifests</text>
  <text x="910" y="218" text-anchor="middle" class="small">SHA256 chunk hashes</text>
  <text x="910" y="241" text-anchor="middle" class="small">Timeout and size limits</text>
</svg>
