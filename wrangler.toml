name = "open-edge-router"
main = "src/worker.js"
compatibility_date = "2026-05-03"

[vars]
ROUTE_MODE = "health-first"
PRIMARY_PROVIDER = "cdn-a"
SECONDARY_PROVIDER = "cdn-b"
TERTIARY_PROVIDER = "cdn-c"

[[durable_objects.bindings]]
name = "MGP_SIGNAL"
class_name = "MgpSignalRoom"

[[durable_objects.bindings]]
name = "DEMO_PRESENCE"
class_name = "DemoPresenceRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MgpSignalRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["DemoPresenceRoom"]
